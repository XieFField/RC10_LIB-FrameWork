groups:
  - id: host_cpp
    path: jia_docs/tests/host_cpp
    role: current_host_tests
    description: 主机侧 C++ 测试集合，统一由 `jia_docs/tests/run_tests.ps1` 入口调度
    recommended_entrypoints:
      - jia_docs/tests/run_tests.ps1
      - jia_docs/tests/host_cpp/chassis_semantics/run_main.ps1
      - jia_docs/tests/host_cpp/chassis_semantics/run_slim_smoke.ps1
    suites:
      - id: chassis_semantics
        path: jia_docs/tests/host_cpp/chassis_semantics
        status: active
        primary: true
        entrypoints:
          - path: jia_docs/tests/run_tests.ps1
            kind: powershell
            purpose: 主统一入口，按默认顺序调度主机测试与兼容包装脚本
            recommended: true
          - path: jia_docs/tests/host_cpp/chassis_semantics/run_main.ps1
            kind: powershell
            purpose: chassis_semantics FULL_DEBUG doctest 主入口，编译 runner、harness 和行为域分片
            recommended: true
          - path: jia_docs/tests/host_cpp/chassis_semantics/run_slim_smoke.ps1
            kind: powershell
            purpose: chassis RUNTIME_MIN 极限运行固件档 smoke，验证瘦身 profile 可编译运行并降低对象体积
            recommended: true
          - path: jia_docs/tests/tdd/chassis_semantics/run_test.ps1
            kind: powershell
            purpose: chassis_semantics 旧路径兼容入口，新增测试不要优先使用
            recommended: false
      - id: vesc_brake
        path: jia_docs/tests/host_cpp/vesc_brake
        status: active
        primary: false
        entrypoints:
          - path: jia_docs/tests/host_cpp/vesc_brake/run_test.ps1
            kind: powershell
            purpose: VESC 刹车语义回归兼容入口
            recommended: true
      - id: swerve_core
        path: jia_docs/tests/host_cpp/swerve_core
        status: legacy
        primary: false
        entrypoints:
          - path: jia_docs/tests/host_cpp/swerve_core/run_test.ps1
            kind: powershell
            purpose: Module_ChassisSwerve 历史对照入口；当前生产源文件缺失，预期 xfail
            recommended: false
  - id: python_semantics
    path: jia_docs/tests/python_semantics
    role: current_python_tests
    description: Python 语义回归集合，由原 `ai2_tests` 迁移而来
    recommended_entrypoints:
      - jia_docs/tests/python_semantics/swerve_port/lock_now_homing_gate_regression.py
      - jia_docs/tests/python_semantics/lock_now_rot_z/lock_now_rot_z_regression.py
    suites:
      - id: swerve_port
        path: jia_docs/tests/python_semantics/swerve_port
        status: active
        primary: true
        entrypoints:
          - path: jia_docs/tests/python_semantics/swerve_port/lock_now_homing_gate_regression.py
            kind: python
            purpose: 聚合式四舵轮端口语义回归，覆盖 LockNowRotZ、homing、flip、DriveGate、StopSteerGuard
            recommended: true
          - path: jia_docs/tests/python_semantics/swerve_port/four_steer_debug_homing_regression.py
            kind: python
            purpose: 四舵轮 debug/homing 附加回归
            recommended: false
      - id: lock_now_rot_z
        path: jia_docs/tests/python_semantics/lock_now_rot_z
        status: active
        primary: false
        entrypoints:
          - path: jia_docs/tests/python_semantics/lock_now_rot_z/lock_now_rot_z_regression.py
            kind: python
            purpose: LockNowRotZ 缺陷 red/green 回归
            recommended: true
      - id: homing_state
        path: jia_docs/tests/python_semantics/homing_state
        status: active
        primary: false
        entrypoints:
          - path: jia_docs/tests/python_semantics/homing_state/update_homing_state_regression.py
            kind: python
            purpose: updateHomingState 外部状态机回归
            recommended: false
      - id: time_stamp_us64
        path: jia_docs/tests/python_semantics/time_stamp_us64
        status: active
        primary: false
        entrypoints:
          - path: jia_docs/tests/python_semantics/time_stamp_us64/time_stamp_us64_regression.py
            kind: python
            purpose: BSP_RtosTimeStampUs64 接口与换算语义回归
            recommended: false
  - id: historical
    path: jia_docs/tests/historical
    role: legacy_regression
    description: 历史保留区，收纳不再默认执行但仍可作为兼容或对照的旧套件
    recommended_entrypoints:
      - jia_docs/tests/historical/chassis_module/run_test.ps1
      - jia_docs/tests/historical/serial1_protocol_host/run_test.ps1
    suites:
      - id: other_legacy
        path: jia_docs/tests/historical
        status: legacy
        primary: true
        entrypoints:
          - path: jia_docs/tests/historical/chassis_mode_fsm/run_test.ps1
            kind: powershell
            purpose: chassis mode 状态机静态回归
          - path: jia_docs/tests/historical/chassis_module/run_test.ps1
            kind: powershell
            purpose: chassis module 历史编译回归
          - path: jia_docs/tests/historical/four_steer_setup_static/run_test.ps1
            kind: powershell
            purpose: four steer setup 静态结构回归
          - path: jia_docs/tests/historical/four_swerve_path/run_test.ps1
            kind: powershell
            purpose: four swerve path 静态断言
          - path: jia_docs/tests/historical/newrobo_merge_static/run_test.ps1
            kind: powershell
            purpose: newrobo merge 静态回归
          - path: jia_docs/tests/historical/omni_setup_static/run_test.ps1
            kind: powershell
            purpose: omni setup 静态回归
          - path: jia_docs/tests/historical/protocol_merge_static/run_test.ps1
            kind: powershell
            purpose: protocol merge 静态回归
          - path: jia_docs/tests/historical/serial1_protocol_host/run_test.ps1
            kind: powershell
            purpose: serial1 protocol host 历史主机回归
          - path: jia_docs/tests/historical/time_services/run_test.ps1
            kind: powershell
            purpose: time services 历史编译回归
          - path: jia_docs/tests/historical/tri_omni_kinematics/run_test.ps1
            kind: powershell
            purpose: tri-omni 运动学历史回归
recommended_execution_order:
  - jia_docs/tests/run_tests.ps1
  - jia_docs/tests/host_cpp/chassis_semantics/run_main.ps1
  - jia_docs/tests/host_cpp/vesc_brake/run_test.ps1
legacy_focus_entrypoint: jia_docs/tests/legacy_ai_tests/vesc_brake/run_test.ps1
ai_regression_focus_entrypoint: jia_docs/tests/python_semantics/swerve_port/lock_now_homing_gate_regression.py
