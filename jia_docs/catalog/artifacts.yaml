groups:
  - id: ai2_artifacts
    path: jia_docs/artifacts/ai2_artifacts
    role: current_ai_outputs
    description: 当前 AI 回归与分析过程的中间产物、摘要产物归档区
    children:
      - id: swerve_port
        path: jia_docs/artifacts/ai2_artifacts/swerve_port
        status: reserved
        purpose: 存放 swerve_port 聚合回归的 JSON 或摘要输出
        produced_by:
          - jia_docs/tests/ai2_tests/swerve_port/lock_now_homing_gate_regression.py
      - id: lock_now_rot_z
        path: jia_docs/artifacts/ai2_artifacts/lock_now_rot_z
        status: reserved
        purpose: 存放 LockNowRotZ 缺陷复现与修复验证产物
        produced_by:
          - jia_docs/tests/ai2_tests/lock_now_rot_z/lock_now_rot_z_regression.py
  - id: comment_restore_refs
    path: jia_docs/artifacts/comment_restore_refs
    role: reference_materials
    description: 注释恢复与注释对照参考资料目录
    status: empty_or_placeholder
    children: []
policy:
  - 这里只存参考物、过程附件与可追溯产物，不存业务源码副本
  - 能由脚本重建的产物，优先在文档中写明来源与重建方式
